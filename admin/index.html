<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>番星 · 站点工作台</title><link rel="icon" href="/static/star.svg"><link rel="stylesheet" href="/static/admin.css"><script src="/static/admin.js" defer></script></head><body><div class="admin-layout"><aside class="sidebar"><a class="admin-brand" href="/manage"><span>✳</span><div>番星的工作台<small>MY LITTLE INTERNET</small></div></a><p class="nav-heading">我的主页</p><nav id="admin-nav" aria-label="后台导航"><button data-page="overview" aria-current="page"><span>◫</span>总览</button><button data-page="profile"><span>◉</span>个人资料</button><button data-page="sites"><span>▦</span>网站与服务<small id="nav-sites-count">—</small></button><button data-page="community"><span>↗</span>社区主页<small id="nav-profiles-count">—</small></button><button data-page="appearance"><span>◐</span>外观与素材</button><p class="nav-heading">管理</p><button data-page="backup"><span>▣</span>数据备份</button><button data-page="account"><span>⌘</span>账号安全</button></nav><div class="sidebar-bottom"><a href="/" target="_blank" rel="noopener noreferrer">↗ 打开个人主页</a><a href="/logout">↪ 退出登录</a><div class="admin-owner"><img src="/assets/avatar.png" alt=""><div><strong>番星</strong><small>把想法慢慢做成日常。</small></div><span>✳</span></div></div></aside><div class="workspace"><header class="topbar"><span class="breadcrumb">个人主页 <span>/</span> <b id="breadcrumb-current">总览</b></span><div class="topbar-actions"><span id="save-state" role="status"><i></i>正在加载</span><button id="save-all" class="primary" disabled>保存更改 <span>↗</span></button></div></header><div id="preview-banner" hidden>本地设计预览 · 保存只写入本机，方便试用。</div><main id="main-content"><div class="page-heading"><div><p class="eyebrow">FANXING / WORKSPACE</p><h1 id="page-title">欢迎回来，番星<span>✳</span></h1><p id="page-subtitle">把你在互联网上的小小角落，照顾好。</p></div><button id="refresh-data" class="quiet-button">↻ 重新加载</button></div><section id="page-content" aria-live="polite"><p class="empty">正在加载你的站点…</p></section></main><footer class="admin-footer"><span>每一个小站，都有自己的来处。</span><span>番星 · 站点工作台</span></footer></div></div><dialog id="editor-dialog"><form id="editor-form"><div class="dialog-header"><div><p class="eyebrow">LINK EDITOR</p><h2 id="editor-title">编辑网站</h2></div><button type="button" class="close-dialog" aria-label="关闭编辑窗口">×</button></div><div class="dialog-body"><div class="form-grid"><label>名称<input name="name" required maxlength="100" placeholder="给这个入口起个名字"></label><label>显示位置<select name="category"><option value="network">网络与资源</option><option value="dev">代码与运维</option><option value="ai">AI 与共享</option><option value="daily">日常工具</option><option value="blog">博客（置顶）</option><option value="profile">社区主页</option></select></label><label class="full">网址<input name="url" type="url" required placeholder="https://example.com" maxlength="2048"></label><label class="full">一句说明<textarea name="desc" rows="3" maxlength="300" placeholder="这个网站能做什么？"></textarea></label><label>入口标记<input name="mark" maxlength="4" placeholder="如 GH、AI、↓"></label><label>维护与使用说明<input name="note" maxlength="100" placeholder="如：第三方维护、联系获取 Token"></label></div></div><div class="dialog-footer"><button type="button" class="secondary close-dialog">取消</button><button type="submit" class="primary">完成编辑</button></div></form></dialog><dialog id="confirm-dialog"><form method="dialog"><div class="confirm-body"><span class="confirm-symbol">?</span><h2 id="confirm-title">确认操作</h2><p id="confirm-description"></p></div><div class="dialog-footer"><button value="cancel" class="secondary">取消</button><button value="confirm" class="primary" id="confirm-action">确认</button></div></form></dialog><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
